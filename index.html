<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>Il mio diario</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#202735;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
header{background:white;padding:18px 16px 12px;position:sticky;top:0;z-index:5;border-bottom:1px solid #e8eaf0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:22px;margin:0}
.date-nav{display:flex;align-items:center;justify-content:space-between;margin-top:18px;gap:8px}
.date-nav button,.secondary{border:0;background:#f0f2f6;border-radius:10px;padding:10px 13px;color:#30394a}
#dateTitle{text-align:center;font-weight:700}
#dateTitle small{display:block;font-weight:400;color:#7b8494;margin-top:4px}
main{max-width:680px;margin:auto;padding:14px 12px 100px}
.card{background:white;border-radius:15px;padding:15px;margin-bottom:13px;box-shadow:0 2px 8px #20273506}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
h2{font-size:16px;margin:0}
.add{border:0;background:#e9efff;color:#285bc5;padding:8px 11px;border-radius:9px;font-weight:600}
.muted{color:#8992a1;font-size:13px}
.timeline{position:relative}
.hour{height:52px;position:relative;border-top:1px solid #e9ecf1;padding-left:51px}
.hour-label{position:absolute;left:0;top:-8px;font-size:11px;color:#8992a1;background:white;padding-right:7px}
.shift-bg{position:absolute;left:51px;right:0;height:51px;opacity:.20;border-left:4px solid}
.shift-label{position:absolute;left:59px;top:4px;font-size:11px;font-weight:700;opacity:.9}
.task-on-hour{position:absolute;left:58px;right:4px;top:19px;z-index:2}
.task{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #f0f1f4}
.task:last-child{border-bottom:0}
.task input[type=checkbox],.item input{width:18px;height:18px;margin:2px 0 0;accent-color:#3978e8;flex-shrink:0}
.task-text{flex:1;min-width:0}
.task-name{overflow-wrap:anywhere}
.done .task-name{text-decoration:line-through;color:#9ba2ad}
.task-time{font-size:12px;color:#8992a1;margin-top:3px}
.icon-btn{border:0;background:transparent;color:#8992a1;padding:2px 5px;font-size:18px}
.section-row{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #f0f1f4}
.section-row:last-child{border-bottom:0}
.section-open{flex:1;text-align:left;border:0;background:transparent;color:#202735;padding:0;min-width:0}
.section-name{font-weight:600}
.section-info{font-size:12px;color:#8992a1;margin-top:4px}
.items{padding:2px 0 8px 12px}
.item{display:flex;align-items:flex-start;gap:9px;padding:8px 0}
.item span{flex:1;overflow-wrap:anywhere}
.item.checked span{text-decoration:line-through;color:#9ba2ad}
.item-add{display:flex;gap:7px;margin-top:8px}
.item-add input{flex:1;min-width:0}
input,select{border:1px solid #dfe3ea;border-radius:9px;padding:11px;background:white;color:#202735;width:100%;min-width:0}
label{display:block;font-size:13px;color:#626d7e;margin:12px 0 5px}
.form{display:none;border-top:1px solid #edf0f4;padding-top:12px;margin-top:12px}
.form.show{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.full{grid-column:1/-1}
.primary{border:0;background:#3978e8;color:white;padding:12px 15px;border-radius:10px;font-weight:600;width:100%;margin-top:14px}
.cancel{border:0;background:transparent;color:#737d8c;padding:10px;margin-top:4px;width:100%}
.empty{font-size:13px;color:#8992a1;padding:8px 0}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;border-top:1px solid #e8eaf0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;z-index:6}
.bottom button{flex:1;max-width:220px;border:0;background:#f0f2f6;border-radius:10px;padding:11px 5px;color:#30394a}
.bottom button.active{background:#3978e8;color:white}
.page{display:none}
.page.active{display:block}
.shift-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #edf0f4}
.shift-row:last-child{border:0}
.shift-row input[type=color]{width:38px;height:38px;padding:3px}
.shift-row .shift-name{flex:1;min-width:0}
.shift-row .shift-name strong{display:block}
.shift-row .shift-name small{color:#8992a1}
.danger{color:#d34b54}
@media(max-width:390px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.date-nav button{padding:9px}.hour{padding-left:44px}.shift-bg{left:44px}.task-on-hour{left:51px}}
</style>
</head>
<body>

<header>
  <div class="top">
    <h1>Il mio diario</h1>
    <button class="secondary" onclick="goToday()">Oggi</button>
  </div>
  <div class="date-nav">
    <button onclick="moveDay(-1)">‹</button>
    <div id="dateTitle"></div>
    <button onclick="moveDay(1)">›</button>
  </div>
</header>

<main>
  <div class="page active" id="diaryPage">
    <section class="card">
      <div class="card-head">
        <h2>La mia giornata</h2>
        <span class="muted" id="shiftSummary"></span>
      </div>
      <div class="timeline" id="timeline"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Attività</h2>
        <button class="add" onclick="openTaskForm()">+ Task</button>
      </div>
      <div id="tasks"></div>
      <div id="taskForm" class="form">
        <div class="grid">
          <div class="full">
            <label>Nome dell'attività</label>
            <input id="taskName" placeholder="Es. Fare attività fisica">
          </div>
          <div>
            <label>Ora preferita</label>
            <input id="taskTime" type="time" value="09:00">
          </div>
          <div>
            <label>Ripetizione</label>
            <select id="taskFreq" onchange="toggleCustom('task')">
              <option value="once">Solo questo giorno</option>
              <option value="daily">Tutti i giorni</option>
              <option value="every">Ogni N giorni</option>
              <option value="weekly">Ogni settimana</option>
              <option value="monthly">Ogni mese</option>
            </select>
          </div>
          <div id="taskEveryBox" style="display:none">
            <label>Ogni quanti giorni</label>
            <input id="taskEvery" type="number" min="1" value="2">
          </div>
          <div>
            <label>Inizio</label>
            <input id="taskStart" type="date">
          </div>
          <div>
            <label>Fine (facoltativa)</label>
            <input id="taskEnd" type="date">
          </div>
        </div>
        <button class="primary" onclick="saveTask()">Salva attività</button>
        <button class="cancel" onclick="closeForms()">Annulla</button>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Le mie sezioni</h2>
        <button class="add" onclick="openSectionForm()">+ Sezione</button>
      </div>
      <div id="sections"></div>
      <div id="sectionForm" class="form">
        <label>Nome della sezione</label>
        <input id="sectionName" placeholder="Es. Spesa">
        <label>Ripetizione</label>
        <select id="sectionFreq" onchange="toggleCustom('section')">
          <option value="once">Solo questo giorno</option>
          <option value="daily">Tutti i giorni</option>
          <option value="every">Ogni N giorni</option>
          <option value="weekly">Ogni settimana</option>
          <option value="monthly">Ogni mese</option>
        </select>
        <div id="sectionEveryBox" style="display:none">
          <label>Ogni quanti giorni</label>
          <input id="sectionEvery" type="number" min="1" value="2">
        </div>
        <div class="grid">
          <div>
            <label>Inizio</label>
            <input id="sectionStart" type="date">
          </div>
          <div>
            <label>Fine (facoltativa)</label>
            <input id="sectionEnd" type="date">
          </div>
        </div>
        <button class="primary" onclick="saveSection()">Crea sezione</button>
        <button class="cancel" onclick="closeForms()">Annulla</button>
      </div>
    </section>
  </div>

  <div class="page" id="shiftsPage">
    <section class="card">
      <div class="card-head">
        <h2>I miei turni</h2>
        <button class="add" onclick="openShiftForm()">+ Turno</button>
      </div>
      <p class="muted">Crea i tipi di turno con orari e colori. Poi componi la tua sequenza.</p>
      <div id="shiftList"></div>
      <div id="shiftForm" class="form">
        <label>Nome del turno</label>
        <input id="shiftName" placeholder="Es. Mattina">
        <div class="grid">
          <div>
            <label>Inizio</label>
            <input id="shiftStart" type="time" value="06:00">
          </div>
          <div>
            <label>Fine</label>
            <input id="shiftEnd" type="time" value="14:00">
          </div>
          <div class="full">
            <label>Colore</label>
            <input id="shiftColor" type="color" value="#e7b83f">
          </div>
        </div>
        <button class="primary" onclick="saveShift()">Salva turno</button>
        <button class="cancel" onclick="closeForms()">Annulla</button>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><h2>La mia rotazione</h2></div>
      <p class="muted">Inserisci i turni nell'ordine in cui li lavori. La sequenza verrà ripetuta automaticamente.</p>
      <div class="grid">
        <div class="full">
          <label>Data del primo turno</label>
          <input id="cycleStart" type="date">
        </div>
        <div class="full">
          <label>Turno del primo giorno</label>
          <select id="cycleChoice"></select>
        </div>
      </div>
      <button class="secondary" style="width:100%;margin-top:8px" onclick="addCycleDay()">+ Aggiungi giorno alla sequenza</button>
      <div id="cycleList" style="margin-top:10px"></div>
      <div class="grid">
        <div>
          <label>Numero di ripetizioni</label>
          <input id="cycleRepeats" type="number" min="1" value="20">
        </div>
      </div>
      <button class="primary" onclick="saveCycle()">Applica rotazione</button>
      <button class="cancel danger" onclick="clearCycle()">Rimuovi rotazione</button>
      <p class="muted" id="cycleInfo"></p>
    </section>
  </div>

  <div class="page" id="calendarPage">
    <section class="card">
      <div class="card-head"><h2>Vai a una data</h2></div>
      <label>Seleziona il giorno</label>
      <input type="date" id="calendarDate" onchange="selectDate(this.value)">
      <button class="primary" onclick="goToday()">Torna a oggi</button>
    </section>
  </div>
</main>

<nav class="bottom">
  <button class="active" onclick="showPage('diaryPage',this)">Diario</button>
  <button onclick="showPage('shiftsPage',this)">Turni</button>
  <button onclick="showPage('calendarPage',this)">Calendario</button>
</nav>

<script>
const $=id=>document.getElementById(id);
const today=()=>dateStr(new Date());
const dateStr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parseDate=s=>{let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{let d=parseDate(s);d.setDate(d.getDate()+n);return dateStr(d)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const read=(k,f)=>{try{return JSON.parse(localStorage.getItem('diario_'+k))??f}catch{return f}};
const write=(k,v)=>localStorage.setItem('diario_'+k,JSON.stringify(v));

let data={
  shifts:read('shifts',[]),
  cycle:read('cycle',null),
  tasks:read('tasks',[]),
  sections:read('sections',[]),
  checks:read('checks',{}),
  items:read('items',{})
};
let selected=today(),cycleDraft=[];

function persist(){
  for(let k in data)write(k,data[k]);
}
function showPage(id,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  $(id).classList.add('active');
  document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(id==='shiftsPage')renderShifts();
}
function moveDay(n){selected=addDays(selected,n);render()}
function goToday(){selected=today();render();showPage('diaryPage',document.querySelector('.bottom button'))}
function selectDate(s){if(s){selected=s;render();showPage('diaryPage',document.querySelector('.bottom button'))}}
function dateLabel(s){
  return parseDate(s).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
function safe(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function shiftFor(day){
  let c=data.cycle;
  if(!c||!c.days.length||day<c.start)return null;
  let diff=Math.round((parseDate(day)-parseDate(c.start))/86400000);
  let index=Math.floor(diff%c.days.length);
  if(diff>=c.days.length*c.repeats)return null;
  let id=c.days[index];
  return data.shifts.find(s=>s.id===id)||null;
}
function occurs(obj,day){
  if(day<obj.start||(obj.end&&day>obj.end))return false;
  let diff=Math.round((parseDate(day)-parseDate(obj.start))/86400000);
  if(obj.freq==='once')return day===obj.start;
  if(obj.freq==='daily')return true;
  if(obj.freq==='every')return diff%Math.max(1,Number(obj.every)||1)===0;
  if(obj.freq==='weekly')return diff%7===0;
  if(obj.freq==='monthly'){
    let a=parseDate(obj.start),b=parseDate(day);
    return a.getDate()===b.getDate();
  }
  return false;
}
function checkKey(type,id,day){return type+'_'+id+'_'+day}
function isChecked(type,id,day){return !!data.checks[checkKey(type,id,day)]}
function setChecked(type,id,day,val){
  let k=checkKey(type,id,day);
  if(val)data.checks[k]=true;else delete data.checks[k];
  persist();render();
}
function render(){
  $('dateTitle').innerHTML=safe(dateLabel(selected)).replace(/, /,'<small>').replace(/$/,'</small>');
  $('calendarDate').value=selected;
  renderTimeline();renderTasks();renderSections();
}
function renderTimeline(){
  let shift=shiftFor(selected);
  $('shiftSummary').textContent=shift?shift.name:'';
  let html='';
  for(let h=0;h<24;h++){
    let hh=String(h).padStart(2,'0')+':00';
    let active=false;
    if(shift){
      let start=Number(shift.start.split(':')[0])+Number(shift.start.split(':')[1])/60;
      let end=Number(shift.end.split(':')[0])+Number(shift.end.split(':')[1])/60;
      active=start<end?(h>=start&&h<end):(h>=start||h<end);
    }
    html+=`<div class="hour">
      <span class="hour-label">${hh}</span>
      ${active?`<div class="shift-bg" style="background:${shift.color};border-color:${shift.color}"></div>
      ${h===Number(shift.start.split(':')[0])?`<span class="shift-label" style="color:${shift.color}">${safe(shift.name)} · ${shift.start}–${shift.end}</span>`:''}`:''}
    </div>`;
  }
  $('timeline').innerHTML=html;
}
function renderTasks(){
  let tasks=data.tasks.filter(t=>occurs(t,selected)).sort((a,b)=>a.time.localeCompare(b.time));
  $('tasks').innerHTML=tasks.length?tasks.map(t=>{
    let done=isChecked('task',t.id,selected);
    return `<div class="task ${done?'done':''}">
      <input type="checkbox" ${done?'checked':''} onchange="setChecked('task','${t.id}','${selected}',this.checked)">
      <div class="task-text">
        <div class="task-name">${safe(t.name)}</div>
        <div class="task-time">${safe(t.time)}${t.freq!=='once'?' · Ricorrente':''}</div>
      </div>
      <button class="icon-btn" onclick="deleteTask('${t.id}')" aria-label="Elimina">×</button>
    </div>`;
  }).join(''):'<div class="empty">Nessuna attività per questo giorno.</div>';
}
function renderSections(){
  let sections=data.sections.filter(s=>occurs(s,selected));
  $('sections').innerHTML=sections.length?sections.map(s=>{
    let list=data.items[s.id]||[];
    let checked=list.filter(i=>i.done).length;
    return `<div class="section-row">
      <button class="section-open" onclick="toggleSection('${s.id}')">
        <div class="section-name">${safe(s.name)}</div>
        <div class="section-info">${checked}/${list.length} completati · Tocca per aprire</div>
      </button>
      <button class="icon-btn" onclick="deleteSection('${s.id}')" aria-label="Elimina sezione">×</button>
    </div>
    <div id="items_${s.id}" class="items" style="display:none">
      ${list.map(i=>`<div class="item ${i.done?'checked':''}">
        <input type="checkbox" ${i.done?'checked':''} onchange="toggleItem('${s.id}','${i.id}',this.checked)">
        <span>${safe(i.text)}</span>
        <button class="icon-btn" onclick="deleteItem('${s.id}','${i.id}')">×</button>
      </div>`).join('')}
      <div class="item-add">
        <input id="new_${s.id}" placeholder="Aggiungi elemento">
        <button class="add" onclick="addItem('${s.id}')">+</button>
      </div>
    </div>`;
  }).join(''):'<div class="empty">Nessuna sezione per questo giorno.</div>';
}
function closeForms(){
  ['taskForm','sectionForm','shiftForm'].forEach(id=>$(id).classList.remove('show'));
}
function openTaskForm(){
  closeForms();$('taskForm').classList.add('show');
  $('taskName').value='';$('taskTime').value='09:00';
  $('taskFreq').value='once';$('taskEveryBox').style.display='none';
  $('taskEvery').value=2;$('taskStart').value=selected;$('taskEnd').value='';
  $('taskName').focus();
}
function toggleCustom(type){
  let freq=$(type+'Freq').value;
  $(type+'EveryBox').style.display=freq==='every'?'block':'none';
}
function saveTask(){
  let name=$('taskName').value.trim();
  if(!name)return alert('Inserisci il nome dell’attività.');
  let start=$('taskStart').value||selected,end=$('taskEnd').value;
  if(end&&end<start)return alert('La data finale precede quella iniziale.');
  data.tasks.push({id:uid(),name,time:$('taskTime').value||'09:00',
    freq:$('taskFreq').value,every:Number($('taskEvery').value)||2,start,end});
  persist();closeForms();render();
}
function deleteTask(id){
  if(!confirm('Eliminare questa attività e la sua ricorrenza?'))return;
  data.tasks=data.tasks.filter(t=>t.id!==id);persist();render();
}
function openSectionForm(){
  closeForms();$('sectionForm').classList.add('show');
  $('sectionName').value='';$('sectionFreq').value='once';
  $('sectionEveryBox').style.display='none';
  $('sectionEvery').value=2;$('sectionStart').value=selected;$('sectionEnd').value='';
  $('sectionName').focus();
}
function saveSection(){
  let name=$('sectionName').value.trim();
  if(!name)return alert('Inserisci il nome della sezione.');
  let start=$('sectionStart').value||selected,end=$('sectionEnd').value;
  if(end&&end<start)return alert('La data finale precede quella iniziale.');
  let id=uid();
  data.sections.push({id,name,freq:$('sectionFreq').value,
    every:Number($('sectionEvery').value)||2,start,end});
  data.items[id]=[];
  persist();closeForms();render();
}
function toggleSection(id){
  let el=$('items_'+id);
  el.style.display=el.style.display==='none'?'block':'none';
}
function addItem(id){
  let el=$('new_'+id),text=el.value.trim();
  if(!text)return;
  if(!data.items[id])data.items[id]=[];
  data.items[id].push({id:uid(),text,done:false});
  persist();renderSections();
  $('items_'+id).style.display='block';
  $('new_'+id).focus();
}
function toggleItem(sid,iid,done){
  let item=(data.items[sid]||[]).find(i=>i.id===iid);
  if(item){item.done=done;persist();renderSections();$('items_'+sid).style.display='block';}
}
function deleteItem(sid,iid){
  data.items[sid]=(data.items[sid]||[]).filter(i=>i.id!==iid);
  persist();renderSections();$('items_'+sid).style.display='block';
}
function deleteSection(id){
  if(!confirm('Eliminare questa sezione e il suo contenuto?'))return;
  data.sections=data.sections.filter(s=>s.id!==id);
  delete data.items[id];persist();renderSections();
}
function openShiftForm(){
  closeForms();$('shiftForm').classList.add('show');
  $('shiftName').value='';$('shiftStart').value='06:00';
  $('shiftEnd').value='14:00';$('shiftColor').value='#e7b83f';
  $('shiftName').focus();
}
function saveShift(){
  let name=$('shiftName').value.trim();
  if(!name)return alert('Inserisci il nome del turno.');
  let s={id:uid(),name,start:$('shiftStart').value,end:$('shiftEnd').value,color:$('shiftColor').value};
  if(s.start===s.end)return alert('Inizio e fine non possono coincidere.');
  data.shifts.push(s);persist();closeForms();renderShifts();
}
function renderShifts(){
  $('shiftList').innerHTML=data.shifts.length?data.shifts.map(s=>`
    <div class="shift-row">
      <input type="color" value="${s.color}" onchange="changeShiftColor('${s.id}',this.value)">
      <div class="shift-name"><strong>${safe(s.name)}</strong><small>${s.start} – ${s.end}</small></div>
      <button class="icon-btn" onclick="deleteShift('${s.id}')">×</button>
    </div>`).join(''):'<div class="empty">Crea i tuoi tipi di turno.</div>';
  $('cycleChoice').innerHTML=data.shifts.map(s=>`<option value="${s.id}">${safe(s.name)}</option>`).join('');
  if(data.cycle){
    cycleDraft=[...data.cycle.days];
    $('cycleStart').value=data.cycle.start;
    $('cycleRepeats').value=data.cycle.repeats;
  }else{
    cycleDraft=[];
    $('cycleStart').value=selected;
    $('cycleRepeats').value=20;
  }
  renderCycle();
}
function changeShiftColor(id,color){
  let s=data.shifts.find(s=>s.id===id);
  if(s)s.color=color;
  persist();render();
}
function deleteShift(id){
  if(data.cycle&&data.cycle.days.includes(id)){
    return alert('Questo turno è nella rotazione. Rimuovi o modifica prima la rotazione.');
  }
  if(!confirm('Eliminare questo tipo di turno?'))return;
  data.shifts=data.shifts.filter(s=>s.id!==id);
  persist();renderShifts();
}
function addCycleDay(){
  if(!data.shifts.length)return alert('Crea prima almeno un tipo di turno.');
  cycleDraft.push($('cycleChoice').value);
  renderCycle();
}
function renderCycle(){
  $('cycleList').innerHTML=cycleDraft.map((id,i)=>{
    let s=data.shifts.find(s=>s.id===id);
    return `<div class="shift-row">
      <span style="color:#8992a1;width:20px">${i+1}.</span>
      <div class="shift-name"><strong>${safe(s?s.name:'Turno eliminato')}</strong></div>
      <button class="icon-btn" onclick="removeCycleDay(${i})">×</button>
    </div>`;
  }).join('');
  $('cycleInfo').textContent=cycleDraft.length?
    `Sequenza: ${cycleDraft.length} giorni · ${cycleDraft.length*(Number($('cycleRepeats').value)||1)} giorni totali`:
    'La sequenza non è ancora impostata.';
}
function removeCycleDay(i){cycleDraft.splice(i,1);renderCycle()}
function saveCycle(){
  let start=$('cycleStart').value||selected;
  let repeats=Number($('cycleRepeats').value);
  if(!cycleDraft.length)return alert('Aggiungi almeno un turno alla sequenza.');
  if(!repeats||repeats<1)return alert('Inserisci un numero valido di ripetizioni.');
  data.cycle={start,days:[...cycleDraft],repeats};
  persist();renderShifts();render();
  alert('Rotazione salvata.');
}
function clearCycle(){
  if(!confirm('Rimuovere la rotazione dei turni?'))return;
  data.cycle=null;cycleDraft=[];persist();renderShifts();render();
}
$('cycleRepeats').addEventListener('input',renderCycle);
render();
</script>
</body>
</html>
