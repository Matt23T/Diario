<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>Il mio diario</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#202735;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
header{background:white;padding:18px 16px 14px;position:sticky;top:0;z-index:5;border-bottom:1px solid #e8eaf0}
.top{display:flex;justify-content:flex-end;align-items:center}
.today-btn{border:0;background:#f0f2f6;border-radius:10px;padding:9px 14px;color:#30394a}
.date-nav{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.date-nav button{border:0;background:#f0f2f6;border-radius:10px;padding:9px 14px;color:#30394a}
#dateTitle{font-weight:700;text-align:center;cursor:pointer}
#dateTitle small{display:block;font-weight:400;color:#8992a1;margin-top:4px}
#datePicker{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
main{max-width:680px;margin:auto;padding:14px 12px 110px}
.card{background:white;border-radius:15px;padding:15px;margin-bottom:13px;box-shadow:0 2px 8px #20273506}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
h2{font-size:16px;margin:0}
.muted{color:#8992a1;font-size:13px}
.hour{min-height:55px;position:relative;border-top:1px solid #e9ecf1;padding:5px 4px 5px 51px}
.hour-label{position:absolute;left:0;top:-8px;font-size:11px;color:#8992a1;background:white;padding-right:7px}
.shift-bg,.activity-bg{position:absolute;left:51px;right:0;top:0;bottom:0;pointer-events:none}
.shift-bg{opacity:.20;border-left:4px solid}
.activity-bg{opacity:.24}
.shift-label{position:absolute;left:58px;top:3px;font-size:10px;font-weight:700;opacity:.9}
.hour-tasks{position:relative;z-index:2;margin-top:7px}
.task{display:flex;align-items:center;gap:8px;padding:6px 7px;margin:3px 0;border-radius:8px;background:#f0f2f6;font-size:13px}
.task input{width:17px;height:17px;margin:0;accent-color:#3978e8;flex-shrink:0}
.task-name{flex:1;overflow-wrap:anywhere}
.task.done .task-name{text-decoration:line-through;opacity:.55}
.activity-task{background:#ffffffd9}
.icon-btn{border:0;background:transparent;color:#8992a1;padding:2px 5px;font-size:18px}
.section-row{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #f0f1f4}
.section-open{flex:1;text-align:left;border:0;background:transparent;color:#202735;padding:0}
.section-name{font-weight:600}
.section-info{font-size:12px;color:#8992a1;margin-top:4px}
.items{padding:5px 0 10px 12px}
.item{display:flex;align-items:center;gap:9px;padding:8px 0}
.item input{width:18px;height:18px;accent-color:#3978e8}
.item span{flex:1;overflow-wrap:anywhere}
.item.checked span{text-decoration:line-through;color:#9ba2ad}
input,select{border:1px solid #dfe3ea;border-radius:9px;padding:11px;background:white;color:#202735;width:100%;min-width:0}
input[type=color]{height:43px;padding:4px}
label{display:block;font-size:13px;color:#626d7e;margin:12px 0 5px}
.form{display:none;border-top:1px solid #edf0f4;padding-top:12px;margin-top:12px}
.form.show{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.full{grid-column:1/-1}
.primary{border:0;background:#3978e8;color:white;padding:12px 15px;border-radius:10px;font-weight:600;width:100%;margin-top:14px}
.secondary{border:0;background:#f0f2f6;color:#30394a;padding:10px;border-radius:9px}
.cancel{border:0;background:transparent;color:#737d8c;padding:10px;margin-top:4px;width:100%}
.empty{font-size:13px;color:#8992a1;padding:8px 0}
.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;align-items:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom));z-index:8;pointer-events:none}
.plus{pointer-events:auto;border:0;background:#3978e8;color:white;border-radius:50%;width:58px;height:58px;font-size:32px;box-shadow:0 4px 14px #3978e855}
.menu{display:none;position:fixed;bottom:85px;left:50%;transform:translateX(-50%);width:min(260px,90%);background:white;border-radius:15px;padding:9px;box-shadow:0 5px 25px #20273525;z-index:9}
.menu.show{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:white;padding:13px;border-radius:9px;color:#202735}
.menu button:active{background:#f0f2f6}
.shift-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #edf0f4}
.shift-row input[type=color]{width:38px;height:38px;padding:3px}
.shift-name{flex:1;min-width:0}
.shift-name strong{display:block}
.shift-name small{color:#8992a1}
.item-add{display:flex;gap:7px;margin-top:8px}
.item-add input{flex:1}
.danger{color:#d34b54}
@media(max-width:390px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>

<header>
  <div class="top">
    <button class="today-btn" onclick="goToday()">Oggi</button>
  </div>
  <div class="date-nav">
    <button onclick="moveDay(-1)">‹</button>
    <div id="dateTitle" onclick="openDate()"> </div>
    <button onclick="moveDay(1)">›</button>
  </div>
  <input type="date" id="datePicker" onchange="selectDate(this.value)">
</header>

<main>
  <section class="card">
    <div class="card-head">
      <span class="muted" id="shiftSummary"></span>
    </div>
    <div id="timeline"></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>LISTE</h2>
    </div>
    <div id="sections"></div>
  </section>

  <section class="card" id="shiftManagement" style="display:none">
    <div class="card-head">
      <h2>I miei turni</h2>
      <button class="secondary" onclick="openShiftForm()">+ Turno</button>
    </div>
    <div id="shiftList"></div>

    <div id="shiftForm" class="form">
      <label>Nome del turno</label>
      <input id="shiftName" placeholder="Es. Mattina">
      <div class="grid">
        <div>
          <label>Inizio</label>
          <input id="shiftStart" type="time" value="06:00">
        </div>
        <div>
          <label>Fine</label>
          <input id="shiftEnd" type="time" value="14:00">
        </div>
        <div class="full">
          <label>Colore</label>
          <input id="shiftColor" type="color" value="#e7b83f">
        </div>
      </div>
      <button class="primary" onclick="saveShift()">Salva turno</button>
      <button class="cancel" onclick="closeForms()">Annulla</button>
    </div>

    <div style="border-top:1px solid #edf0f4;margin-top:15px;padding-top:15px">
      <h2>Rotazione turni</h2>
      <p class="muted">Inserisci i turni nell'ordine in cui li lavori.</p>
      <label>Data del primo turno</label>
      <input id="cycleStart" type="date">
      <label>Aggiungi un turno alla sequenza</label>
      <div class="item-add">
        <select id="cycleChoice"></select>
        <button class="secondary" onclick="addCycleDay()">+</button>
      </div>
      <div id="cycleList"></div>
      <label>Numero di ripetizioni</label>
      <input id="cycleRepeats" type="number" min="1" value="20">
      <button class="primary" onclick="saveCycle()">Applica rotazione</button>
      <button class="cancel danger" onclick="clearCycle()">Rimuovi rotazione</button>
      <p class="muted" id="cycleInfo"></p>
    </div>
  </section>

  <section class="card" id="taskForm" style="display:none">
    <div class="card-head"><h2>Nuova attività</h2></div>
    <label>Nome dell'attività</label>
    <input id="taskName" placeholder="Es. Fare attività fisica">
    <div class="grid">
      <div>
        <label>Ora di inizio (facoltativa)</label>
        <input id="taskTime" type="time">
      </div>
      <div>
        <label>Ora di fine (facoltativa)</label>
        <input id="taskTimeEnd" type="time">
      </div>
      <div class="full">
        <label>Colore</label>
        <input id="taskColor" type="color" value="#3978e8">
      </div>
      <div>
        <label>Ripetizione</label>
        <select id="taskFreq" onchange="toggleCustom('task')">
          <option value="once">Solo questo giorno</option>
          <option value="daily">Tutti i giorni</option>
          <option value="every">Ogni tot giorni</option>
          <option value="weekly">Ogni settimana</option>
          <option value="monthly">Ogni mese</option>
        </select>
      </div>
      <div id="taskEveryBox" style="display:none">
        <label>Ogni quanti giorni</label>
        <input id="taskEvery" type="number" min="1" value="2">
      </div>
      <div>
        <label>Inizio</label>
        <input id="taskStart" type="date">
      </div>
      <div>
        <label>Fine (facoltativa)</label>
        <input id="taskEnd" type="date">
      </div>
    </div>
    <button class="primary" onclick="saveTask()">Salva attività</button>
    <button class="cancel" onclick="closeForms()">Annulla</button>
  </section>

  <section class="card" id="sectionForm" style="display:none">
    <div class="card-head"><h2>Nuova lista</h2></div>
    <label>Nome della lista</label>
    <input id="sectionName" placeholder="Es. Spesa">
    <label>Orario (facoltativo)</label>
    <input id="sectionTime" type="time">
    <label>Ripetizione</label>
    <select id="sectionFreq" onchange="toggleCustom('section')">
      <option value="once">Solo questo giorno</option>
      <option value="daily">Tutti i giorni</option>
      <option value="every">Ogni tot giorni</option>
      <option value="weekly">Ogni settimana</option>
      <option value="monthly">Ogni mese</option>
    </select>
    <div id="sectionEveryBox" style="display:none">
      <label>Ogni quanti giorni</label>
      <input id="sectionEvery" type="number" min="1" value="2">
    </div>
    <label>Se non viene completata</label>
    <select id="sectionCarry">
      <option value="reset">Ricominciare normalmente</option>
      <option value="carry">Riproporla nei giorni successivi</option>
    </select>
    <div class="grid">
      <div>
        <label>Inizio</label>
        <input id="sectionStart" type="date">
      </div>
      <div>
        <label>Fine (facoltativa)</label>
        <input id="sectionEnd" type="date">
      </div>
    </div>
    <div id="sectionItems">
      <label>Voci della lista</label>
      <div id="sectionItemList"></div>
      <div class="item-add">
        <input id="sectionItemInput" placeholder="Scrivi una voce">
        <button class="secondary" onclick="addSectionDraftItem()">+</button>
      </div>
    </div>
    <button class="primary" onclick="saveSection()">Salva lista</button>
    <button class="cancel" onclick="closeForms()">Annulla</button>
  </section>
</main>

<div class="menu" id="addMenu">
  <button onclick="openTaskForm()">✓ Nuova attività</button>
  <button onclick="openShiftManagement()">◷ Gestisci turni</button>
  <button onclick="openSectionForm()">☰ Nuova lista</button>
</div>

<div class="bottom">
  <button class="plus" onclick="toggleMenu()">+</button>
</div>

<script>
const $=id=>document.getElementById(id);
const today=()=>dateStr(new Date());
const dateStr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parseDate=s=>{let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{let d=parseDate(s);d.setDate(d.getDate()+n);return dateStr(d)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const read=(k,f)=>{try{return JSON.parse(localStorage.getItem('diario_'+k))??f}catch{return f}};
const write=(k,v)=>localStorage.setItem('diario_'+k,JSON.stringify(v));

let data={
  shifts:read('shifts',[]),
  cycle:read('cycle',null),
  tasks:read('tasks',[]),
  sections:read('sections',[]),
  checks:read('checks',{}),
  items:read('items',{}),
  activityChecks:read('activityChecks',{})
};
let selected=today(),cycleDraft=[],sectionDraft=[];

function persist(){
  for(let k in data)write(k,data[k]);
}
function safe(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function dateLabel(s){
  return parseDate(s).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
function openDate(){
  $('datePicker').value=selected;
  $('datePicker').showPicker? $('datePicker').showPicker():$('datePicker').click();
}
function selectDate(s){
  if(s){selected=s;render();}
}
function moveDay(n){selected=addDays(selected,n);render()}
function goToday(){selected=today();render()}
function toggleMenu(){
  $('addMenu').classList.toggle('show');
}
function closeForms(){
  ['taskForm','sectionForm','shiftForm'].forEach(id=>{
    if($(id))$(id).classList.remove('show');
  });
  $('addMenu').classList.remove('show');
}
function showForm(id){
  closeForms();
  $(id).style.display='block';
  $(id).scrollIntoView({behavior:'smooth',block:'center'});
}
function occurs(obj,day){
  if(day<obj.start||(obj.end&&day>obj.end))return false;
  let diff=Math.round((parseDate(day)-parseDate(obj.start))/86400000);
  if(obj.freq==='once')return day===obj.start;
  if(obj.freq==='daily')return true;
  if(obj.freq==='every')return diff%Math.max(1,Number(obj.every)||1)===0;
  if(obj.freq==='weekly')return diff%7===0;
  if(obj.freq==='monthly'){
    let a=parseDate(obj.start),b=parseDate(day);
    return a.getDate()===b.getDate();
  }
  return false;
}
function carriesOver(s){
  return s.carryOver===undefined||s.carryOver===true;
}
function sectionCompleted(s){
  let list=data.items[s.id]||[];
  return list.length>0&&list.every(i=>i.done);
}
function occursSection(s,day){
  if(occurs(s,day))return true;
  return carriesOver(s)&&day>s.start&&!sectionCompleted(s);
}
function itemCheckKey(sid,iid,day){
  return sid+'_'+iid+'_'+day;
}
function isItemChecked(sid,item,day){
  let section=data.sections.find(s=>s.id===sid);
  if(section&&carriesOver(section))return !!item.done;
  return !!data.activityChecks[itemCheckKey(sid,item.id,day)];
}
function shiftFor(day){
  let c=data.cycle;
  if(!c||!c.days.length||day<c.start)return null;
  let diff=Math.round((parseDate(day)-parseDate(c.start))/86400000);
  if(diff>=c.days.length*c.repeats)return null;
  return data.shifts.find(s=>s.id===c.days[diff%c.days.length])||null;
}
function checkKey(id,day){return id+'_'+day}
function isChecked(id,day){return !!data.checks[checkKey(id,day)]}
function setChecked(id,day,val){
  let k=checkKey(id,day);
  if(val)data.checks[k]=true;else delete data.checks[k];
  persist();render();
}
function timeMinutes(t){
  let [h,m]=t.split(':').map(Number);
  return h*60+m;
}
function mixColors(colors){
  let rgb=colors.map(c=>c.match(/[a-f\d]{2}/gi).map(v=>parseInt(v,16)));
  let mixed=[0,1,2].map(i=>Math.round(rgb.reduce((sum,c)=>sum+c[i],0)/rgb.length));
  return '#'+mixed.map(v=>v.toString(16).padStart(2,'0')).join('');
}
function activityGradient(tasks,h){
  let colors=[];
  for(let m=0;m<=60;m++){
    let minute=h*60+m;
    let active=tasks.filter(t=>t.time&&t.timeEnd&&
      timeMinutes(t.time)<minute&&timeMinutes(t.timeEnd)>minute);
    colors.push(active.length?mixColors(active.map(t=>t.color||'#3978e8')):'transparent');
  }
  let stops=colors.map((c,i)=>`${c} ${i/60*100}%`);
  return `linear-gradient(to bottom,${stops.join(',')})`;
}
function render(){
  $('dateTitle').innerHTML=safe(dateLabel(selected)).replace(', ','<small>')+'</small>';
  renderTimeline();
  renderSections();
}
function renderTimeline(){
  let shift=shiftFor(selected);
  $('shiftSummary').textContent=shift?shift.name:'';
  let tasks=data.tasks.filter(t=>occurs(t,selected)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  let timedSections=data.sections.filter(s=>s.time&&occursSection(s,selected));
  let timedTasks=tasks.filter(t=>t.time);
  let untimedTasks=tasks.filter(t=>!t.time);
  let html='';
  if(untimedTasks.length){
    html+=`<div class="hour-tasks" style="margin:0 0 10px">
      <div class="muted" style="margin:5px 0">Senza orario</div>
      ${untimedTasks.map(t=>{
        let done=isChecked(t.id,selected);
        return `<div class="task ${done?'done':''}">
          <input type="checkbox" ${done?'checked':''} onchange="setChecked('${t.id}','${selected}',this.checked)">
          <span class="task-name">${safe(t.name)}</span>
          <button class="icon-btn" onclick="deleteTask('${t.id}')">×</button>
        </div>`;
      }).join('')}
    </div>`;
  }
  for(let h=0;h<24;h++){
    let start=shift?Number(shift.start.slice(0,2))+Number(shift.start.slice(3))/60:0;
    let end=shift?Number(shift.end.slice(0,2))+Number(shift.end.slice(3))/60:0;
    let active=shift&&(start<end?(h>=start&&h<end):(h>=start||h<end));
    let hourTasks=timedTasks.filter(t=>Number(t.time.slice(0,2))===h);
    let hourSections=timedSections.filter(s=>Number(s.time.slice(0,2))===h);
    let hourActivities=timedTasks.filter(t=>t.time&&t.timeEnd&&
      timeMinutes(t.time)<(h+1)*60&&timeMinutes(t.timeEnd)>h*60);
    html+=`<div class="hour">
      <span class="hour-label">${String(h).padStart(2,'0')}:00</span>
      ${active?`<div class="shift-bg" style="background:${shift.color};border-color:${shift.color}"></div>`:''}
      ${hourActivities.length?`<div class="activity-bg" style="background:${activityGradient(hourActivities,h)}"></div>`:''}
      ${active&&h===Math.floor(start)?`<span class="shift-label" style="color:${shift.color}">${safe(shift.name)} · ${shift.start}–${shift.end}</span>`:''}
      <div class="hour-tasks">
        ${hourTasks.map(t=>{
          let done=isChecked(t.id,selected);
          return `<div class="task activity-task ${done?'done':''}" style="border-left:3px solid ${t.color||'#3978e8'}">
            <input type="checkbox" ${done?'checked':''} onchange="setChecked('${t.id}','${selected}',this.checked)">
            <span class="task-name">${safe(t.name)}</span>
            <span class="muted">${t.time}${t.timeEnd?'–'+t.timeEnd:''}</span>
            <button class="icon-btn" onclick="deleteTask('${t.id}')">×</button>
          </div>`;
        }).join('')}
        ${hourSections.map(s=>`
          <div class="task">
            <span class="task-name">${safe(s.name)}</span>
            <span class="muted">${s.time}</span>
          </div>
        `).join('')}
      </div>
    </div>`;
  }
  $('timeline').innerHTML=html;
}
function renderSections(){
  let sections=data.sections.filter(s=>occursSection(s,selected));
  $('sections').innerHTML=sections.length?sections.map(s=>{
    let list=data.items[s.id]||[];
    let checked=list.filter(i=>isItemChecked(s.id,i,selected)).length;
    return `<div class="section-row">
      <button class="section-open" onclick="toggleSection('${s.id}')">
        <div class="section-name">${safe(s.name)}</div>
        <div class="section-info">${checked}/${list.length} completati · Tocca per aprire</div>
      </button>
      <button class="icon-btn" onclick="deleteSection('${s.id}')">×</button>
    </div>
    <div id="items_${s.id}" class="items" style="display:none">
      ${list.map(i=>{
        let done=isItemChecked(s.id,i,selected);
        return `<div class="item ${done?'checked':''}">
          <input type="checkbox" ${done?'checked':''} onchange="toggleItem('${s.id}','${i.id}',this.checked,'${selected}')">
          <span>${safe(i.text)}</span>
          <button class="icon-btn" onclick="deleteItem('${s.id}','${i.id}')">×</button>
        </div>`;
      }).join('')}
      <div class="item-add">
        <input id="new_${s.id}" placeholder="Aggiungi voce">
        <button class="secondary" onclick="addItem('${s.id}')">+</button>
      </div>
    </div>`;
  }).join(''):'<div class="empty">Nessuna lista per questo giorno.</div>';
}
function openTaskForm(){
  showForm('taskForm');
  $('taskName').value='';$('taskTime').value='';
  $('taskTimeEnd').value='';$('taskColor').value='#3978e8';
  $('taskFreq').value='once';$('taskEveryBox').style.display='none';
  $('taskStart').value=selected;$('taskEnd').value='';
  $('taskName').focus();
}
function toggleCustom(type){
  $(type+'EveryBox').style.display=$(type+'Freq').value==='every'?'block':'none';
}
function saveTask(){
  let name=$('taskName').value.trim();
  if(!name)return alert('Inserisci il nome dell’attività.');
  let time=$('taskTime').value,timeEnd=$('taskTimeEnd').value;
  if(timeEnd&&!time)return alert('Inserisci anche l’ora di inizio.');
  if(time&&timeEnd&&timeEnd<=time)return alert('L’ora di fine deve essere successiva all’ora di inizio.');
  let start=$('taskStart').value||selected,end=$('taskEnd').value;
  if(end&&end<start)return alert('La data finale precede quella iniziale.');
  data.tasks.push({id:uid(),name,time,timeEnd,color:$('taskColor').value,
    freq:$('taskFreq').value,every:Number($('taskEvery').value)||2,start,end});
  persist();closeForms();render();
}
function deleteTask(id){
  if(!confirm('Eliminare questa attività e la sua ricorrenza?'))return;
  data.tasks=data.tasks.filter(t=>t.id!==id);
  persist();render();
}
function openSectionForm(){
  showForm('sectionForm');
  $('sectionName').value='';$('sectionTime').value='';$('sectionFreq').value='once';
  $('sectionCarry').value='reset';
  $('sectionEveryBox').style.display='none';
  $('sectionEvery').value=2;$('sectionStart').value=selected;$('sectionEnd').value='';
  sectionDraft=[];renderSectionDraft();
  $('sectionName').focus();
}
function addSectionDraftItem(){
  let input=$('sectionItemInput'),text=input.value.trim();
  if(!text)return;
  sectionDraft.push(text);input.value='';renderSectionDraft();input.focus();
}
function renderSectionDraft(){
  $('sectionItemList').innerHTML=sectionDraft.map((x,i)=>`
    <div class="item"><span>${safe(x)}</span>
    <button class="icon-btn" onclick="removeSectionDraftItem(${i})">×</button></div>`).join('');
}
function removeSectionDraftItem(i){sectionDraft.splice(i,1);renderSectionDraft()}
function saveSection(){
  let name=$('sectionName').value.trim();
  if(!name)return alert('Inserisci il nome della lista.');
  let start=$('sectionStart').value||selected,end=$('sectionEnd').value;
  if(end&&end<start)return alert('La data finale precede quella iniziale.');
  let id=uid();
  data.sections.push({id,name,time:$('sectionTime').value,
    freq:$('sectionFreq').value,every:Number($('sectionEvery').value)||2,start,end,
    carryOver:$('sectionCarry').value==='carry'});
  data.items[id]=sectionDraft.map(text=>({id:uid(),text,done:false}));
  persist();closeForms();render();
}
function toggleSection(id){
  let el=$('items_'+id);
  el.style.display=el.style.display==='none'?'block':'none';
}
function addItem(id){
  let el=$('new_'+id),text=el.value.trim();
  if(!text)return;
  if(!data.items[id])data.items[id]=[];
  data.items[id].push({id:uid(),text,done:false});
  persist();renderSections();
  $('items_'+id).style.display='block';
}
function toggleItem(sid,iid,done,day){
  let item=(data.items[sid]||[]).find(i=>i.id===iid);
  let section=data.sections.find(s=>s.id===sid);
  if(item&&section){
    if(carriesOver(section)){
      item.done=done;
    }else{
      let key=itemCheckKey(sid,iid,day);
      if(done)data.activityChecks[key]=true;
      else delete data.activityChecks[key];
    }
    persist();renderSections();$('items_'+sid).style.display='block';
  }
}
function deleteItem(sid,iid){
  data.items[sid]=(data.items[sid]||[]).filter(i=>i.id!==iid);
  persist();renderSections();$('items_'+sid).style.display='block';
}
function deleteSection(id){
  if(!confirm('Eliminare questa lista e il suo contenuto?'))return;
  data.sections=data.sections.filter(s=>s.id!==id);
  delete data.items[id];persist();renderSections();
}
function openShiftManagement(){
  closeForms();
  $('shiftManagement').style.display='block';
  $('shiftManagement').scrollIntoView({behavior:'smooth',block:'start'});
  renderShifts();
}
function openShiftForm(){
  $('shiftForm').classList.add('show');
  $('shiftName').value='';$('shiftStart').value='06:00';
  $('shiftEnd').value='14:00';$('shiftColor').value='#e7b83f';
}
function saveShift(){
  let name=$('shiftName').value.trim();
  if(!name)return alert('Inserisci il nome del turno.');
  let s={id:uid(),name,start:$('shiftStart').value,end:$('shiftEnd').value,color:$('shiftColor').value};
  if(s.start===s.end)return alert('Inizio e fine non possono coincidere.');
  data.shifts.push(s);persist();$('shiftForm').classList.remove('show');renderShifts();
}
function renderShifts(){
  $('shiftList').innerHTML=data.shifts.length?data.shifts.map(s=>`
    <div class="shift-row">
      <input type="color" value="${s.color}" onchange="changeShiftColor('${s.id}',this.value)">
      <div class="shift-name"><strong>${safe(s.name)}</strong><small>${s.start} – ${s.end}</small></div>
      <button class="icon-btn" onclick="deleteShift('${s.id}')">×</button>
    </div>`).join(''):'<div class="empty">Crea i tuoi tipi di turno.</div>';
  $('cycleChoice').innerHTML=data.shifts.map(s=>`<option value="${s.id}">${safe(s.name)}</option>`).join('');
  if(data.cycle){
    cycleDraft=[...data.cycle.days];
    $('cycleStart').value=data.cycle.start;
    $('cycleRepeats').value=data.cycle.repeats;
  }else{
    cycleDraft=[];$('cycleStart').value=selected;$('cycleRepeats').value=20;
  }
  renderCycle();
}
function changeShiftColor(id,color){
  let s=data.shifts.find(s=>s.id===id);
  if(s)s.color=color;
  persist();render();
}
function deleteShift(id){
  if(data.cycle&&data.cycle.days.includes(id))return alert('Questo turno è nella rotazione. Rimuovi prima la rotazione.');
  if(!confirm('Eliminare questo tipo di turno?'))return;
  data.shifts=data.shifts.filter(s=>s.id!==id);
  persist();renderShifts();
}
function addCycleDay(){
  if(!data.shifts.length)return alert('Crea prima almeno un tipo di turno.');
  cycleDraft.push($('cycleChoice').value);renderCycle();
}
function renderCycle(){
  $('cycleList').innerHTML=cycleDraft.map((id,i)=>{
    let s=data.shifts.find(s=>s.id===id);
    return `<div class="shift-row">
      <span>${i+1}.</span>
      <div class="shift-name"><strong>${safe(s?s.name:'Turno eliminato')}</strong></div>
      <button class="icon-btn" onclick="removeCycleDay(${i})">×</button>
    </div>`;
  }).join('');
  $('cycleInfo').textContent=cycleDraft.length?
    `Sequenza: ${cycleDraft.length} giorni · ${cycleDraft.length*(Number($('cycleRepeats').value)||1)} giorni totali`:
    'La sequenza non è ancora impostata.';
}
function removeCycleDay(i){cycleDraft.splice(i,1);renderCycle()}
function saveCycle(){
  let start=$('cycleStart').value||selected;
  let repeats=Number($('cycleRepeats').value);
  if(!cycleDraft.length)return alert('Aggiungi almeno un turno alla sequenza.');
  if(!repeats||repeats<1)return alert('Inserisci un numero valido di ripetizioni.');
  data.cycle={start,days:[...cycleDraft],repeats};
  persist();renderShifts();render();alert('Rotazione salvata.');
}
function clearCycle(){
  if(!confirm('Rimuovere la rotazione dei turni?'))return;
  data.cycle=null;cycleDraft=[];persist();renderShifts();render();
}
$('cycleRepeats').addEventListener('input',renderCycle);
render();
</script>
</body>
</html>
