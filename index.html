<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>Il mio diario</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#202735;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
header{background:white;padding:18px 16px 14px;position:sticky;top:0;z-index:5;border-bottom:1px solid #e8eaf0}
.top{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.today-btn,.settings-btn{border:0;background:#f0f2f6;border-radius:10px;padding:9px 14px;color:#30394a}
.settings-btn{font-size:19px;padding:6px 11px}
.date-nav{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.date-nav button{border:0;background:#f0f2f6;border-radius:10px;padding:9px 14px;color:#30394a}
#dateTitle{font-weight:700;text-align:center;cursor:pointer}
#dateTitle small{display:block;font-weight:400;color:#8992a1;margin-top:4px}
main{max-width:680px;margin:auto;padding:14px 12px 110px}
.card{background:white;border-radius:15px;padding:15px;margin-bottom:13px;box-shadow:0 2px 8px #20273506}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
h2{font-size:16px;margin:0}
.muted{color:#8992a1;font-size:13px}
.hour{min-height:55px;position:relative;border-top:1px solid #e9ecf1;padding:5px 4px 5px 51px}
.hour-label{position:absolute;left:0;top:-8px;font-size:11px;color:#8992a1;background:white;padding-right:7px}
.shift-bg,.activity-bg{position:absolute;left:51px;right:0;top:0;bottom:0;pointer-events:none}
.shift-bg{opacity:.20;border-left:4px solid}
.activity-bg{opacity:.24}
.shift-label{position:absolute;left:58px;top:3px;font-size:10px;font-weight:700;opacity:.9}
.hour-tasks{position:relative;z-index:2;margin-top:7px}
.task{display:flex;align-items:center;gap:8px;padding:6px 7px;margin:3px 0;border-radius:8px;background:#f0f2f6;font-size:13px}
.task input{width:17px;height:17px;margin:0;accent-color:#3978e8;flex-shrink:0}
.task-name{flex:1;overflow-wrap:anywhere}
.task.done .task-name{text-decoration:line-through;opacity:.55}
.activity-task{background:#ffffffd9}
.icon-btn{border:0;background:transparent;color:#8992a1;padding:2px 5px;font-size:18px}
.section-row{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #f0f1f4}
.section-open{flex:1;text-align:left;border:0;background:transparent;color:#202735;padding:0}
.section-name{font-weight:600}
.section-name.done{text-decoration:line-through;opacity:.55}
.section-info{font-size:12px;color:#8992a1;margin-top:4px}
.items{padding:5px 0 10px 12px}
.item{display:flex;align-items:center;gap:9px;padding:8px 0}
.item input{width:18px;height:18px;accent-color:#3978e8}
.item span{flex:1;overflow-wrap:anywhere}
.item.checked span{text-decoration:line-through;color:#9ba2ad}
input,select{border:1px solid #dfe3ea;border-radius:9px;padding:11px;background:white;color:#202735;width:100%;min-width:0}
input[type=color]{height:43px;padding:4px}
label{display:block;font-size:13px;color:#626d7e;margin:12px 0 5px}
.form{display:none;border-top:1px solid #edf0f4;padding-top:12px;margin-top:12px}
.form.show{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.full{grid-column:1/-1}
.primary{border:0;background:#3978e8;color:white;padding:12px 15px;border-radius:10px;font-weight:600;width:100%;margin-top:14px}
.secondary{border:0;background:#f0f2f6;color:#30394a;padding:10px;border-radius:9px}
.cancel{border:0;background:transparent;color:#737d8c;padding:10px;margin-top:4px;width:100%}
.empty{font-size:13px;color:#8992a1;padding:8px 0}
.overview-day{font-size:13px;font-weight:700;color:#626d7e;padding:12px 0 6px;border-top:1px solid #edf0f4}
.overview-day:first-child{border-top:0;padding-top:0}
.overview-row{display:flex;align-items:center;gap:10px;padding:9px 7px;margin:3px 0;border-radius:8px;background:#f5f6f8;border-left:3px solid #3978e8;font-size:13px}
.overview-row input{width:17px;height:17px;margin:0;accent-color:#3978e8;flex-shrink:0}
.overview-row.done .overview-name{text-decoration:line-through;opacity:.55}
.overview-time{color:#8992a1;white-space:nowrap}
.overview-name{flex:1;overflow-wrap:anywhere}
.weekday-options{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.weekday-options label{display:flex;align-items:center;gap:4px;margin:0;padding:7px 9px;background:#f0f2f6;border-radius:8px}
.weekday-options input{width:16px;height:16px;margin:0}
.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;align-items:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom));z-index:8;pointer-events:none}
.plus{pointer-events:auto;border:0;background:#3978e8;color:white;border-radius:50%;width:58px;height:58px;font-size:32px;box-shadow:0 4px 14px #3978e855}
.menu{display:none;position:fixed;bottom:85px;left:50%;transform:translateX(-50%);width:min(260px,90%);background:white;border-radius:15px;padding:9px;box-shadow:0 5px 25px #20273525;z-index:9}
.menu.show{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:white;padding:13px;border-radius:9px;color:#202735}
.menu button:active{background:#f0f2f6}
.shift-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #edf0f4}
.shift-row input[type=color]{width:38px;height:38px;padding:3px}
.shift-name{flex:1;min-width:0}
.shift-name strong{display:block}
.shift-name small{color:#8992a1}
.item-add{display:flex;gap:7px;margin-top:8px}
.item-add input{flex:1}
.danger{color:#d34b54}
.overlay{display:none;position:fixed;inset:0;background:#20273555;z-index:20;align-items:flex-start;justify-content:center;padding:90px 18px 20px}
.overlay.show{display:flex}
.popup{background:white;border-radius:17px;width:100%;max-width:360px;padding:16px;box-shadow:0 8px 30px #20273525}
.popup-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
.popup-head h2{font-size:17px}
.close-btn{border:0;background:#f0f2f6;border-radius:50%;width:32px;height:32px;color:#626d7e;font-size:20px}
.calendar-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calendar-nav button{border:0;background:#f0f2f6;border-radius:9px;padding:7px 12px;color:#30394a}
.calendar-month{text-transform:capitalize;font-weight:600}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.calendar-weekday{font-size:11px;color:#8992a1;padding:5px 0}
.calendar-day{height:42px;border:1px solid transparent;border-radius:10px;background:#f5f6f8;color:#30394a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px}
.calendar-day.other{opacity:.35}
.calendar-day.selected{border:2px solid #3978e8}
.calendar-day.today{font-weight:700}
.calendar-day strong{font-size:13px;line-height:15px}
.calendar-day small{font-size:10px;font-weight:700;line-height:11px}
.settings-option{width:100%;text-align:left;border:0;background:#f5f6f8;border-radius:10px;padding:14px;color:#202735;margin-bottom:8px}
.manager-row{padding:12px 0;border-bottom:1px solid #edf0f4}
.manager-info{font-size:12px;color:#8992a1;margin:5px 0 9px}
.manager-row button{padding:7px 13px}
@media(max-width:390px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>

<header>
  <div class="top">
    <button class="today-btn" onclick="goToday()">Oggi</button>
    <button class="settings-btn" onclick="openSettings()">⚙️</button>
  </div>
  <div class="date-nav">
    <button onclick="moveDay(-1)">‹</button>
    <div id="dateTitle" onclick="openDate()"> </div>
    <button onclick="moveDay(1)">›</button>
  </div>
</header>

<div class="overlay" id="calendarOverlay" onclick="closeDate(event)">
  <div class="popup" onclick="event.stopPropagation()">
    <div class="popup-head">
      <h2>Calendario</h2>
      <button class="close-btn" onclick="closeDate()">×</button>
    </div>
    <div class="calendar-nav">
      <button onclick="changeCalendarMonth(-1)">‹</button>
      <span class="calendar-month" id="calendarMonth"></span>
      <button onclick="changeCalendarMonth(1)">›</button>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>
</div>

<div class="overlay" id="settingsOverlay" onclick="closeSettings(event)">
  <div class="popup" onclick="event.stopPropagation()">
    <div class="popup-head">
      <h2>Impostazioni</h2>
      <button class="close-btn" onclick="closeSettings()">×</button>
    </div>
    <button class="settings-option" onclick="openShiftManagement()">◷ Gestione turni</button>
    <button class="settings-option" onclick="openActivityManager()">✎ Modifica liste / attività</button>
    <button class="settings-option" onclick="openHistory()">▤ Storico attività</button>
  </div>
</div>

<main>
  <section class="card">
    <div class="card-head">
      <h2>LISTE</h2>
    </div>
    <div id="sections"></div>
  </section>

  <section class="card">
    <div class="card-head">
      <span class="muted" id="shiftSummary"></span>
    </div>
    <div id="timeline"></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>ATTIVITÀ</h2>
    </div>
    <div id="activityOverviewList"></div>
  </section>

  <section class="card" id="shiftManagement" style="display:none">
    <div class="card-head">
      <h2>I miei turni</h2>
      <button class="secondary" onclick="openShiftForm()">+ Turno</button>
    </div>
    <div id="shiftList"></div>

    <div id="shiftForm" class="form">
      <label>Nome del turno</label>
      <input id="shiftName" placeholder="Es. Mattina">
      <div class="grid">
        <div>
          <label>Inizio</label>
          <input id="shiftStart" type="time" value="06:00">
        </div>
        <div>
          <label>Fine</label>
          <input id="shiftEnd" type="time" value="14:00">
        </div>
        <div class="full">
          <label>Colore</label>
          <input id="shiftColor" type="color" value="#e7b83f">
        </div>
      </div>
      <button class="primary" onclick="saveShift()">Salva turno</button>
      <button class="cancel" onclick="closeForms()">Annulla</button>
    </div>

    <div style="border-top:1px solid #edf0f4;margin-top:15px;padding-top:15px">
      <h2>Rotazione turni</h2>
      <p class="muted">Inserisci i turni nell'ordine in cui li lavori.</p>
      <label>Data del primo turno</label>
      <input id="cycleStart" type="date">
      <label>Aggiungi un turno alla sequenza</label>
      <div class="item-add">
        <select id="cycleChoice"></select>
        <button class="secondary" onclick="addCycleDay()">+</button>
      </div>
      <div id="cycleList"></div>
      <label>Numero di ripetizioni</label>
      <input id="cycleRepeats" type="number" min="1" value="20">
      <button class="primary" onclick="saveCycle()">Applica rotazione</button>
      <button class="cancel danger" onclick="clearCycle()">Rimuovi rotazione</button>
      <p class="muted" id="cycleInfo"></p>
    </div>
  </section>

  <section class="card" id="activityManager" style="display:none">
    <div class="card-head">
      <h2>Modifica liste / attività</h2>
      <button class="secondary" onclick="closeActivityManager()">Chiudi</button>
    </div>
    <div id="activityManagerList"></div>
  </section>

  <section class="card" id="activityHistory" style="display:none">
    <div class="card-head">
      <h2>Storico attività</h2>
      <button class="secondary" onclick="closeHistory()">Chiudi</button>
    </div>
    <div id="activityHistoryList"></div>
  </section>

  <section class="card" id="taskForm" style="display:none">
    <div class="card-head"><h2>Nuova attività</h2></div>
    <label>Nome dell'attività</label>
    <input id="taskName" placeholder="Es. Fare attività fisica">
    <div class="grid">
      <div>
        <label>Ora di inizio (facoltativa)</label>
        <input id="taskTime" type="time">
      </div>
      <div>
        <label>Ora di fine (facoltativa)</label>
        <input id="taskTimeEnd" type="time">
      </div>
      <div class="full">
        <label>Colore</label>
        <input id="taskColor" type="color" value="#3978e8">
      </div>
      <div class="full">
        <label>Tipo di attività</label>
        <select id="taskMode" onchange="toggleTaskMode()">
          <option value="once">Singola</option>
          <option value="carry">Ripeti se non completata</option>
          <option value="routine">Routine</option>
        </select>
      </div>
      <div id="taskRoutineBox" class="full" style="display:none">
        <label>Frequenza della routine</label>
        <select id="taskFreq" onchange="toggleCustom('task')">
          <option value="daily">Tutti i giorni</option>
          <option value="weekdays">Giorni della settimana</option>
          <option value="weekly">Ogni settimana</option>
          <option value="every">Ogni tot giorni</option>
          <option value="monthly">Ogni mese</option>
        </select>
        <div id="taskEveryBox" style="display:none">
          <label>Ogni quanti giorni</label>
          <input id="taskEvery" type="number" min="1" value="2">
        </div>
        <div id="taskWeekdaysBox" style="display:none">
          <label>Giorni in cui ripetere</label>
          <div class="weekday-options">
            <label><input type="checkbox" name="taskDay" value="1"> Lun</label>
            <label><input type="checkbox" name="taskDay" value="2"> Mar</label>
            <label><input type="checkbox" name="taskDay" value="3"> Mer</label>
            <label><input type="checkbox" name="taskDay" value="4"> Gio</label>
            <label><input type="checkbox" name="taskDay" value="5"> Ven</label>
            <label><input type="checkbox" name="taskDay" value="6"> Sab</label>
            <label><input type="checkbox" name="taskDay" value="0"> Dom</label>
          </div>
        </div>
      </div>
      <div class="full">
        <label>Inizio</label>
        <input id="taskStart" type="date">
      </div>
      <div class="full">
        <label>Fine (facoltativa)</label>
        <input id="taskEnd" type="date">
      </div>
    </div>
    <button class="primary" onclick="saveTask()">Salva attività</button>
    <button class="cancel" onclick="cancelEdit()">Annulla</button>
  </section>

  <section class="card" id="sectionForm" style="display:none">
    <div class="card-head"><h2>Nuova lista</h2></div>
    <label>Nome della lista</label>
    <input id="sectionName" placeholder="Es. Spesa">
    <label>Orario (facoltativo)</label>
    <input id="sectionTime" type="time">
    <label>Ripetizione</label>
    <select id="sectionFreq" onchange="toggleCustom('section')">
      <option value="once">Solo questo giorno</option>
      <option value="daily">Tutti i giorni</option>
      <option value="every">Ogni tot giorni</option>
      <option value="weekly">Ogni settimana</option>
      <option value="monthly">Ogni mese</option>
    </select>
    <div id="sectionEveryBox" style="display:none">
      <label>Ogni quanti giorni</label>
      <input id="sectionEvery" type="number" min="1" value="2">
    </div>
    <label>Se non viene completata</label>
    <select id="sectionCarry">
      <option value="reset">Ricominciare normalmente</option>
      <option value="carry">Riproporla nei giorni successivi</option>
    </select>
    <div class="grid">
      <div>
        <label>Inizio</label>
        <input id="sectionStart" type="date">
      </div>
      <div>
        <label>Fine (facoltativa)</label>
        <input id="sectionEnd" type="date">
      </div>
    </div>
    <div id="sectionItems">
      <label>Voci della lista</label>
      <div id="sectionItemList"></div>
      <div class="item-add">
        <input id="sectionItemInput" placeholder="Scrivi una voce">
        <button class="secondary" onclick="addSectionDraftItem()">+</button>
      </div>
    </div>
    <button class="primary" onclick="saveSection()">Salva lista</button>
    <button class="cancel" onclick="cancelEdit()">Annulla</button>
  </section>
</main>

<div class="menu" id="addMenu">
  <button onclick="openTaskForm()">✓ Nuova attività</button>
  <button onclick="openSectionForm()">☰ Nuova lista</button>
</div>

<div class="bottom">
  <button class="plus" onclick="toggleMenu()">+</button>
</div>

<script>
const $=id=>document.getElementById(id);
const today=()=>dateStr(new Date());
const dateStr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parseDate=s=>{let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{let d=parseDate(s);d.setDate(d.getDate()+n);return dateStr(d)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const read=(k,f)=>{try{return JSON.parse(localStorage.getItem('diario_'+k))??f}catch{return f}};
const write=(k,v)=>localStorage.setItem('diario_'+k,JSON.stringify(v));

let data={
  shifts:read('shifts',[]),
  cycle:read('cycle',null),
  tasks:read('tasks',[]),
  sections:read('sections',[]),
  checks:read('checks',{}),
  items:read('items',{}),
  activityChecks:read('activityChecks',{}),
  archive:read('archive',[])
};
let selected=today(),cycleDraft=[],sectionDraft=[],sectionEditItems=null;
let editingTaskId=null,editingSectionId=null;
let calendarMonth=parseDate(selected),overviewExpanded=false;

function persist(){
  for(let k in data)write(k,data[k]);
}
function safe(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function dateLabel(s){
  return parseDate(s).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
function saveArchive(type,id,day,name,time,done){
  let key=type+'_'+id+'_'+day;
  data.archive=data.archive.filter(x=>x.key!==key);
  if(done)data.archive.push({key,type,id,day,name,time:time||''});
}
function openDate(){
  calendarMonth=parseDate(selected);
  renderCalendar();
  $('calendarOverlay').classList.add('show');
}
function closeDate(event){
  if(!event||event.target===$('calendarOverlay'))$('calendarOverlay').classList.remove('show');
}
function changeCalendarMonth(n){
  calendarMonth.setMonth(calendarMonth.getMonth()+n);
  renderCalendar();
}
function renderCalendar(){
  $('calendarMonth').textContent=calendarMonth.toLocaleDateString('it-IT',{month:'long',year:'numeric'});
  let year=calendarMonth.getFullYear(),month=calendarMonth.getMonth();
  let first=new Date(year,month,1);
  let offset=(first.getDay()+6)%7;
  let days=new Date(year,month+1,0).getDate();
  let previous=new Date(year,month,0).getDate();
  let html=['L','M','M','G','V','S','D'].map(d=>`<div class="calendar-weekday">${d}</div>`).join('');
  for(let i=0;i<42;i++){
    let day,monthDate,other=false;
    if(i<offset){
      day=previous-offset+i+1;
      monthDate=new Date(year,month-1,day);
      other=true;
    }else if(i>=offset+days){
      day=i-offset-days+1;
      monthDate=new Date(year,month+1,day);
      other=true;
    }else{
      day=i-offset+1;
      monthDate=new Date(year,month,day);
    }
    let date=dateStr(monthDate);
    let shift=shiftFor(date);
    let isRest=shift&&shift.name.trim().toLowerCase()==='riposo';
    let initial=shift?safe(isRest?'R':shift.name.trim().charAt(0).toUpperCase()):'';
    let style=shift&&!isRest?`style="background:${shift.color}25;color:${shift.color}"`:'';
    html+=`<button class="calendar-day ${other?'other':''} ${date===selected?'selected':''} ${date===today()?'today':''}" ${style} onclick="selectCalendarDate('${date}')">
      <strong>${day}</strong>${shift?`<small>${initial}</small>`:''}
    </button>`;
  }
  $('calendarGrid').innerHTML=html;
}
function selectCalendarDate(date){
  selected=date;
  $('calendarOverlay').classList.remove('show');
  render();
}
function openSettings(){
  closeActivityManager();
  $('shiftManagement').style.display='none';
  $('activityHistory').style.display='none';
  $('settingsOverlay').classList.add('show');
}
function closeSettings(event){
  if(!event||event.target===$('settingsOverlay'))$('settingsOverlay').classList.remove('show');
}
function moveDay(n){selected=addDays(selected,n);render()}
function goToday(){selected=today();render()}
function toggleMenu(){
  $('addMenu').classList.toggle('show');
}
function closeForms(){
  ['taskForm','sectionForm'].forEach(id=>{
    $(id).classList.remove('show');
    $(id).style.display='none';
  });
  $('shiftForm').classList.remove('show');
  $('shiftForm').style.display='';
  $('addMenu').classList.remove('show');
}
function showForm(id){
  closeForms();
  $(id).style.display='block';
  $(id).scrollIntoView({behavior:'smooth',block:'center'});
}
function occurs(obj,day){
  if(day<obj.start||(obj.end&&day>obj.end))return false;
  let diff=Math.round((parseDate(day)-parseDate(obj.start))/86400000);
  if(obj.freq==='once')return day===obj.start;
  if(obj.freq==='daily')return true;
  if(obj.freq==='every')return diff%Math.max(1,Number(obj.every)||1)===0;
  if(obj.freq==='weekly')return diff%7===0;
  if(obj.freq==='weekdays')return (obj.days||[]).includes(parseDate(day).getDay());
  if(obj.freq==='monthly'){
    let a=parseDate(obj.start),b=parseDate(day);
    return a.getDate()===b.getDate();
  }
  return false;
}
function occursTask(t,day){
  if(occurs(t,day))return true;
  if(day>today()||t.carryOver!==true||day<=t.start)return false;
  let d=addDays(day,-1);
  while(d>=t.start){
    if(isChecked(t.id,d))return false;
    if(occurs(t,d))return true;
    d=addDays(d,-1);
  }
  return false;
}
function hasCarryReminder(t,day){
  if(day>today()||t.carryOver!==true||day<=t.start)return false;
  let d=addDays(day,-1);
  while(d>=t.start){
    if(isChecked(t.id,d))return false;
    if(occurs(t,d))return true;
    d=addDays(d,-1);
  }
  return false;
}
function carriesOver(s){
  return s.carryOver===undefined||s.carryOver===true;
}
function sectionCompleted(s){
  let list=data.items[s.id]||[];
  return list.length>0&&list.every(i=>i.done);
}
function occursSection(s,day){
  if(occurs(s,day))return true;
  return carriesOver(s)&&day>s.start&&!sectionCompleted(s);
}
function itemCheckKey(sid,iid,day){
  return sid+'_'+iid+'_'+day;
}
function isItemChecked(sid,item,day){
  let section=data.sections.find(s=>s.id===sid);
  if(section&&carriesOver(section))return !!item.done;
  return !!data.activityChecks[itemCheckKey(sid,item.id,day)];
}
function shiftFor(day){
  let c=data.cycle;
  if(!c||!c.days.length||day<c.start)return null;
  let diff=Math.round((parseDate(day)-parseDate(c.start))/86400000);
  if(diff>=c.days.length*c.repeats)return null;
  return data.shifts.find(s=>s.id===c.days[diff%c.days.length])||null;
}
function checkKey(id,day){return id+'_'+day}
function isChecked(id,day){return !!data.checks[checkKey(id,day)]}
function setChecked(id,day,val){
  let k=checkKey(id,day),task=data.tasks.find(t=>t.id===id);
  if(val)data.checks[k]=true;else delete data.checks[k];
  if(task)saveArchive('task',id,day,task.name,task.time,val);
  persist();render();
}
function timeMinutes(t){
  let [h,m]=t.split(':').map(Number);
  return h*60+m;
}
function mixColors(colors){
  let rgb=colors.map(c=>c.match(/[a-f\d]{2}/gi).map(v=>parseInt(v,16)));
  let mixed=[0,1,2].map(i=>Math.round(rgb.reduce((sum,c)=>sum+c[i],0)/rgb.length));
  return '#'+mixed.map(v=>v.toString(16).padStart(2,'0')).join('');
}
function activityGradient(tasks,h){
  let colors=[];
  for(let m=0;m<=60;m++){
    let minute=h*60+m;
    let active=tasks.filter(t=>t.time&&t.timeEnd&&
      timeMinutes(t.time)<minute&&timeMinutes(t.timeEnd)>minute);
    colors.push(active.length?mixColors(active.map(t=>t.color||'#3978e8')):'transparent');
  }
  let stops=colors.map((c,i)=>`${c} ${i/60*100}%`);
  return `linear-gradient(to bottom,${stops.join(',')})`;
}

function renderActivityOverview(){
  let current=today(),tomorrow=addDays(current,1);
  let groups=[
    {name:'OGGI',day:current,tasks:data.tasks.filter(t=>occursTask(t,current))},
    {name:'DOMANI',day:tomorrow,tasks:data.tasks.filter(t=>
      (t.freq==='once'&&occurs(t,tomorrow))||hasCarryReminder(t,tomorrow)
    )}
  ];
  let futureTasks=data.tasks.filter(t=>t.freq==='once'&&t.start>tomorrow)
    .sort((a,b)=>a.start.localeCompare(b.start)||(a.time||'').localeCompare(b.time||''));
  let dates=[...new Set(futureTasks.map(t=>t.start))];
  dates.forEach(day=>groups.push({
    name:dateLabel(day),day,
    tasks:futureTasks.filter(t=>t.start===day)
  }));
  let total=groups.reduce((sum,g)=>sum+g.tasks.length,0);
  let remaining=overviewExpanded?total:20;
  let html='';
  groups.forEach(g=>{
    let tasks=[...g.tasks].sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    if(!tasks.length){
      if(g.day===current)html+=`<div class="overview-day">${g.name}</div><div class="empty">Nessuna attività prevista.</div>`;
      if(g.day===tomorrow)html+=`<div class="overview-day">${g.name}</div><div class="empty">Nessun impegno previsto.</div>`;
      return;
    }
    if(remaining<=0)return;
    html+=`<div class="overview-day">${g.name}</div>`;
    let visible=tasks.slice(0,remaining);
    html+=visible.map(t=>{
      let done=isChecked(t.id,g.day);
      return `
      <div class="overview-row ${done?'done':''}" style="border-left-color:${t.color||'#3978e8'}">
        <input type="checkbox" ${done?'checked':''} onchange="setChecked('${t.id}','${g.day}',this.checked)">
        <span class="overview-time">${t.time||'Senza orario'}${t.timeEnd?'–'+t.timeEnd:''}</span>
        <span class="overview-name">${safe(t.name)}</span>
      </div>`;
    }).join('');
    remaining-=visible.length;
  });
  if(total>20){
    html+=`<button class="secondary" style="width:100%;margin-top:10px" onclick="toggleOverview()">${overviewExpanded?'Mostra meno':'Mostra altro'}</button>`;
  }
  $('activityOverviewList').innerHTML=html;
}

function renderTimeline(){
  let shift=shiftFor(selected);
  let previousShift=shiftFor(addDays(selected,-1));
  $('shiftSummary').textContent=shift?shift.name:'';
  let tasks=data.tasks.filter(t=>occursTask(t,selected)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  let timedSections=data.sections.filter(s=>s.time&&occursSection(s,selected));
  let timedTasks=tasks.filter(t=>t.time);
  let untimedTasks=tasks.filter(t=>!t.time);
  let html='';
  if(untimedTasks.length){
    html+=`<div class="hour-tasks" style="margin:0 0 10px">
      <div class="muted" style="margin:5px 0">Senza orario</div>
      ${untimedTasks.map(t=>{
        let done=isChecked(t.id,selected);
        return `<div class="task ${done?'done':''}">
          <input type="checkbox" ${done?'checked':''} onchange="setChecked('${t.id}','${selected}',this.checked)">
          <span class="task-name">${safe(t.name)}</span>
          <button class="icon-btn" onclick="deleteTask('${t.id}')">×</button>
        </div>`;
      }).join('')}
    </div>`;
  }
  for(let h=0;h<24;h++){
    let start=shift?Number(shift.start.slice(0,2))+Number(shift.start.slice(3))/60:0;
    let end=shift?Number(shift.end.slice(0,2))+Number(shift.end.slice(3))/60:0;
    let previousStart=previousShift?Number(previousShift.start.slice(0,2))+Number(previousShift.start.slice(3))/60:0;
    let previousEnd=previousShift?Number(previousShift.end.slice(0,2))+Number(previousShift.end.slice(3))/60:0;
    let activeShift=shift&&(start<end?(h>=start&&h<end):h>=start)?shift:
      previousShift&&previousStart>=previousEnd&&h<previousEnd?previousShift:null;
    let hourTasks=timedTasks.filter(t=>Number(t.time.slice(0,2))===h);
    let hourSections=timedSections.filter(s=>Number(s.time.slice(0,2))===h);
    let hourActivities=timedTasks.filter(t=>t.time&&t.timeEnd&&
      timeMinutes(t.time)<(h+1)*60&&timeMinutes(t.timeEnd)>h*60);
    html+=`<div class="hour">
      <span class="hour-label">${String(h).padStart(2,'0')}:00</span>
      ${activeShift?`<div class="shift-bg" style="background:${activeShift.color};border-color:${activeShift.color}"></div>`:''}
      ${hourActivities.length?`<div class="activity-bg" style="background:${activityGradient(hourActivities,h)}"></div>`:''}
      ${activeShift===shift&&activeShift&&h===Math.floor(start)?`<span class="shift-label" style="color:${shift.color}">${safe(shift.name)} · ${shift.start}–${shift.end}</span>`:''}
      <div class="hour-tasks">
        ${hourTasks.map(t=>{
          let done=isChecked(t.id,selected);
          return `<div class="task activity-task ${done?'done':''}" style="border-left:3px solid ${t.color||'#3978e8'}">
            <input type="checkbox" ${done?'checked':''} onchange="setChecked('${t.id}','${selected}',this.checked)">
            <span class="task-name">${safe(t.name)}</span>
            <span class="muted">${t.time}${t.timeEnd?'–'+t.timeEnd:''}</span>
            <button class="icon-btn" onclick="deleteTask('${t.id}')">×</button>
          </div>`;
        }).join('')}
        ${hourSections.map(s=>`
          <div class="task">
            <span class="task-name">${safe(s.name)}</span>
            <span class="muted">${s.time}</span>
          </div>
        `).join('')}
      </div>
    </div>`;
  }
  $('timeline').innerHTML=html;
}
function renderSections(){
  let sections=data.sections.filter(s=>occursSection(s,selected));
  $('sections').innerHTML=sections.length?sections.map(s=>{
    let list=data.items[s.id]||[];
    let checked=list.filter(i=>isItemChecked(s.id,i,selected)).length;

    return `<div class="section-row">

function saveTask(){
  let name=$('taskName').value.trim();
  if(!name)return alert('Inserisci il nome dell’attività.');
  let time=$('taskTime').value,timeEnd=$('taskTimeEnd').value;
  if(timeEnd&&!time)return alert('Inserisci anche l’ora di inizio.');
  if(time&&timeEnd&&timeEnd<=time)return alert('L’ora di fine deve essere successiva all’ora di inizio.');
  let start=$('taskStart').value||selected,end=$('taskEnd').value;
  if(end&&end<start)return alert('La data finale precede quella iniziale.');
  let mode=$('taskMode').value;
  let freq=mode==='routine'?$('taskFreq').value:'once';
  let days=[...document.querySelectorAll('input[name="taskDay"]:checked')].map(x=>Number(x.value));
  if(mode==='routine'&&freq==='weekdays'&&!days.length)return alert('Seleziona almeno un giorno della settimana.');
  let task={name,time,timeEnd,color:$('taskColor').value,
    mode,freq,every:Number($('taskEvery').value)||2,days,start,end,
    carryOver:mode==='carry'};
  if(editingTaskId){
    Object.assign(data.tasks.find(t=>t.id===editingTaskId),task);
    editingTaskId=null;closeForms();render();
    $('activityManager').style.display='block';renderActivityManager();
  }else{
    data.tasks.push({id:uid(),...task});
    persist();closeForms();render();
  }
}

function toggleItem(sid,iid,done,day){
  let item=(data.items[sid]||[]).find(i=>i.id===iid);
  let section=data.sections.find(s=>s.id===sid);
  if(item&&section){
    if(carriesOver(section)){
      item.done=done;
    }else{
      let key=itemCheckKey(sid,iid,day);
      if(done)data.activityChecks[key]=true;
      else delete data.activityChecks[key];
    }
    let list=data.items[sid]||[];
    let completed=list.length>0&&list.every(i=>isItemChecked(sid,i,day));
    saveArchive('list',sid,day,section.name,section.time,completed);
    persist();renderSections();$('items_'+sid).style.display='block';
  }
}

function repeatLabel(obj){
  if(obj.mode==='carry'||(obj.mode===undefined&&obj.freq==='once'&&obj.carryOver===true))return 'Ripeti se non completata';
  if(obj.mode==='once'||(obj.mode===undefined&&obj.freq==='once'))return 'Singola';
  if(obj.freq==='daily')return 'Routine · Tutti i giorni';
  if(obj.freq==='weekdays')return 'Routine · '+(obj.days||[]).map(d=>['Dom','Lun','Mar','Mer','Gio','Ven','Sab'][d]).join(', ');
  if(obj.freq==='every')return 'Routine · Ogni '+(Number(obj.every)||2)+' giorni';
  if(obj.freq==='weekly')return 'Routine · Ogni settimana';
  if(obj.freq==='monthly')return 'Routine · Ogni mese';
  return '';
}
function hasFutureOccurrence(obj){
  let start=addDays(today(),1);
  for(let i=0;i<366;i++){
    let day=addDays(start,i);
    if(obj.end&&day>obj.end)return false;
    if(occurs(obj,day))return true;
  }
  return false;
}
function taskVisibleInManager(t){
  let mode=t.mode||(t.freq==='once'?(t.carryOver===true?'carry':'once'):'routine');
  if(mode==='routine')return hasFutureOccurrence(t);
  if(isChecked(t.id,t.start))return false;
  return true;
}
function sectionVisibleInManager(s){
  if(s.freq==='once'){
    let list=data.items[s.id]||[];
    if(list.length&&list.every(i=>isItemChecked(s.id,i,s.start)))return false;
  }
  return s.freq==='once'||hasFutureOccurrence(s);
}
function renderActivityManager(){
  let list=[
    ...data.tasks.filter(taskVisibleInManager).map(x=>({...x,type:'task'})),
    ...data.sections.filter(sectionVisibleInManager).map(x=>({...x,type:'section'}))
  ].sort((a,b)=>(a.start||'').localeCompare(b.start||'')||(a.time||'').localeCompare(b.time||''));
  $('activityManagerList').innerHTML=list.length?list.map(x=>`
    <div class="manager-row">
      <strong>${safe(x.name)}</strong>
      <div class="manager-info">${x.type==='task'?'Attività':'Lista'} · ${dateLabel(x.start)}${x.time?' · '+x.time:''}${x.timeEnd?'–'+x.timeEnd:''}${x.end?' · Fino al '+dateLabel(x.end):''}<br>${x.type==='task'?repeatLabel(x):repeatLabel(x)}</div>
      <button class="secondary" onclick="${x.type==='task'?'editTask':'editSection'}('${x.id}')">Modifica</button>
    </div>`).join(''):'<div class="empty">Non ci sono liste o attività da modificare.</div>';
}
function renderHistory(){
  let history=[...data.archive];
  Object.entries(data.checks).forEach(([key,done])=>{
    if(!done)return;
    let pos=key.lastIndexOf('_'),id=key.slice(0,pos),day=key.slice(pos+1);
    let task=data.tasks.find(t=>t.id===id);
    if(task&&!history.some(x=>x.key==='task_'+id+'_'+day))
      history.push({key:'task_'+id+'_'+day,type:'task',id,day,name:task.name,time:task.time||''});
  });
  Object.entries(data.activityChecks).forEach(([key,done])=>{
    if(!done)return;
    let parts=key.split('_'),day=parts.pop(),iid=parts.pop(),sid=parts.join('_');
    let section=data.sections.find(s=>s.id===sid),list=data.items[sid]||[];
    if(section&&list.length&&list.every(i=>data.activityChecks[itemCheckKey(sid,i.id,day)])&&
      !history.some(x=>x.key==='list_'+sid+'_'+day))
      history.push({key:'list_'+sid+'_'+day,type:'list',id:sid,day,name:section.name,time:section.time||''});
  });
  history.sort((a,b)=>a.day.localeCompare(b.day));
  $('activityHistoryList').innerHTML=history.length?history.map(x=>`
    <div class="manager-row">
      <strong>${safe(x.name)}</strong>
      <div class="manager-info">${x.type==='task'?'Attività':'Lista'} · ${dateLabel(x.day)}${x.time?' · '+x.time:''}</div>
    </div>`).join(''):'<div class="empty">Non hai ancora completato attività.</div>';
}

function editTask(id){
  let t=data.tasks.find(t=>t.id===id);
  if(!t||!taskVisibleInManager(t))return;
  showForm('taskForm');editingTaskId=id;
  $('taskForm').querySelector('h2').textContent='Modifica attività';
  $('taskName').value=t.name;$('taskTime').value=t.time||'';
  $('taskTimeEnd').value=t.timeEnd||'';$('taskColor').value=t.color||'#3978e8';
  let mode=t.mode||(t.freq==='once'?(t.carryOver===true?'carry':'once'):'routine');
  $('taskMode').value=mode;
  $('taskFreq').value=t.freq==='weekdays'?'weekdays':(t.freq==='once'?'daily':t.freq);
  $('taskEvery').value=t.every||2;
  document.querySelectorAll('input[name="taskDay"]').forEach(x=>x.checked=(t.days||[]).includes(Number(x.value)));
  if(t.freq==='daily'&&!t.days)document.querySelectorAll('input[name="taskDay"]').forEach(x=>x.checked=true);
  if(t.freq==='weekly'&&!t.days){
    let weekday=parseDate(t.start).getDay();
    document.querySelectorAll('input[name="taskDay"]').forEach(x=>x.checked=Number(x.value)===weekday);
  }
  $('taskStart').value=t.start;$('taskEnd').value=t.end||'';
  toggleTaskMode();
}
function editSection(id){
  let s=data.sections.find(s=>s.id===id);
  if(!s||!sectionVisibleInManager(s))return;
  showForm('sectionForm');editingSectionId=id;
  $('sectionForm').querySelector('h2').textContent='Modifica lista';
  $('sectionName').value=s.name;$('sectionTime').value=s.time||'';
  $('sectionFreq').value=s.freq;$('sectionEvery').value=s.every||2;
  $('sectionEveryBox').style.display=s.freq==='every'?'block':'none';
  $('sectionCarry').value=carriesOver(s)?'carry':'reset';
  $('sectionStart').value=s.start;$('sectionEnd').value=s.end||'';
  sectionEditItems=(data.items[id]||[]).map(i=>({...i}));
  renderSectionDraft();
}
function cancelEdit(){
  let editing=editingTaskId||editingSectionId;
  editingTaskId=null;editingSectionId=null;sectionEditItems=null;
  closeForms();
  if(editing){
    $('activityManager').style.display='block';
    renderActivityManager();
    $('activityManager').scrollIntoView({behavior:'smooth',block:'start'});
  }
}
function openShiftForm(){
  $('shiftForm').style.display='block';
  $('shiftForm').classList.add('show');
  $('shiftName').value='';$('shiftStart').value='06:00';
  $('shiftEnd').value='14:00';$('shiftColor').value='#e7b83f';
}
function saveShift(){
  let name=$('shiftName').value.trim();
  if(!name)return alert('Inserisci il nome del turno.');
  let s={id:uid(),name,start:$('shiftStart').value,end:$('shiftEnd').value,color:$('shiftColor').value};
  if(s.start===s.end)return alert('Inizio e fine non possono coincidere.');
  data.shifts.push(s);persist();closeForms();renderShifts();
}
function renderShifts(){
  $('shiftList').innerHTML=data.shifts.length?data.shifts.map(s=>`
    <div class="shift-row">
      <input type="color" value="${s.color}" onchange="changeShiftColor('${s.id}',this.value)">
      <div class="shift-name"><strong>${safe(s.name)}</strong><small>${s.start} – ${s.end}</small></div>
      <button class="icon-btn" onclick="deleteShift('${s.id}')">×</button>
    </div>`).join(''):'<div class="empty">Crea i tuoi tipi di turno.</div>';
  $('cycleChoice').innerHTML=data.shifts.map(s=>`<option value="${s.id}">${safe(s.name)}</option>`).join('');
  if(data.cycle){
    cycleDraft=[...data.cycle.days];
    $('cycleStart').value=data.cycle.start;
    $('cycleRepeats').value=data.cycle.repeats;
  }else{
    cycleDraft=[];$('cycleStart').value=selected;$('cycleRepeats').value=20;
  }
  renderCycle();
}
function changeShiftColor(id,color){
  let s=data.shifts.find(s=>s.id===id);
  if(s)s.color=color;
  persist();render();
  if($('calendarOverlay').classList.contains('show'))renderCalendar();
}
function deleteShift(id){
  if(data.cycle&&data.cycle.days.includes(id))return alert('Questo turno è nella rotazione. Rimuovi prima la rotazione.');
  if(!confirm('Eliminare questo tipo di turno?'))return;
  data.shifts=data.shifts.filter(s=>s.id!==id);
  persist();renderShifts();render();
}
function addCycleDay(){
  if(!data.shifts.length)return alert('Crea prima almeno un tipo di turno.');
  cycleDraft.push($('cycleChoice').value);renderCycle();
}
function renderCycle(){
  $('cycleList').innerHTML=cycleDraft.map((id,i)=>{
    let s=data.shifts.find(s=>s.id===id);
    return `<div class="shift-row">
      <span>${i+1}.</span>
      <div class="shift-name"><strong>${safe(s?s.name:'Turno eliminato')}</strong></div>
      <button class="icon-btn" onclick="removeCycleDay(${i})">×</button>
    </div>`;
  }).join('');
  $('cycleInfo').textContent=cycleDraft.length?
    `Sequenza: ${cycleDraft.length} giorni · ${cycleDraft.length*(Number($('cycleRepeats').value)||1)} giorni totali`:
    'La sequenza non è ancora impostata.';
}
function removeCycleDay(i){cycleDraft.splice(i,1);renderCycle()}
function saveCycle(){
  let start=$('cycleStart').value||selected;
  let repeats=Number($('cycleRepeats').value);
  if(!cycleDraft.length)return alert('Aggiungi almeno un turno alla sequenza.');
  if(!repeats||repeats<1)return alert('Inserisci un numero valido di ripetizioni.');
  data.cycle={start,days:[...cycleDraft],repeats};
  persist();renderShifts();render();alert('Rotazione salvata.');
  $('shiftManagement').style.display='none';
  window.scrollTo({top:0,behavior:'smooth'});
  if($('calendarOverlay').classList.contains('show'))renderCalendar();
}
function clearCycle(){
  if(!confirm('Rimuovere la rotazione dei turni?'))return;
  data.cycle=null;cycleDraft=[];persist();renderShifts();render();
  if($('calendarOverlay').classList.contains('show'))renderCalendar();
}
$('cycleRepeats').addEventListener('input',renderCycle);
render();
</script>
</body>
</html>
